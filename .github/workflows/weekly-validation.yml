name: Weekly Validation

on:
  schedule:
    # Weekly scan: Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
  # TEMPORARY: Test trigger for PR validation (remove before merge)
  pull_request:
    paths:
      - '.github/workflows/weekly-validation.yml'
      - '.github/workflows/create-stale-docs-issues.yml'
      - 'scripts/linting/Invoke-MsDateFreshnessCheck.ps1'

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: pwsh

jobs:
  # ms.date freshness validation - hard-fail mode for notification
  msdate-freshness:
    name: ms.date Freshness Check
    uses: ./.github/workflows/msdate-freshness-check.yml
    with:
      staleness-threshold-days: 90
      changed-files-only: false  # Check all files
    permissions:
      contents: read

  # Create or update issues for stale documentation (one issue per file)
  create-stale-docs-issues:
    name: Create or Update Issues for Stale Documentation
    needs: [msdate-freshness]
    # TEMPORARY: Always run on PR trigger for testing, otherwise only on failure
    if: |
      github.event_name == 'pull_request' || 
      (failure() && needs.msdate-freshness.result == 'failure')
    uses: ./.github/workflows/create-stale-docs-issues.yml
    with:
      threshold-days: 90
      artifact-name: msdate-freshness-results
    permissions:
      contents: read
      issues: write
